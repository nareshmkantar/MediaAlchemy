<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tests - Schema Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <style>
        .tests-container {
            margin-top: 24px;
        }

        .test-controls {
            margin-bottom: 24px;
            display: flex;
            justify-content: flex-end;
        }

        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .test-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .test-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
        }

        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .test-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0;
        }

        .test-badge {
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .test-badge.pending {
            background: rgba(148, 163, 184, 0.1);
            color: var(--text-secondary);
        }

        .test-badge.running {
            background: rgba(59, 130, 246, 0.1);
            color: var(--primary);
        }

        .test-badge.passed {
            background: rgba(34, 197, 94, 0.1);
            color: var(--success);
        }

        .test-badge.failed {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .test-badge.error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .test-description {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
            flex-grow: 1;
        }

        .test-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 0.8rem;
            color: var(--text-tertiary);
        }

        .test-meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .test-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .test-result-summary {
            font-size: 0.85rem;
            font-weight: 500;
        }

        .test-log-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 600px;
            max-height: 400px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-2xl);
            display: flex;
            flex-direction: column;
            z-index: 900;
            overflow: hidden;
        }

        .test-log-header {
            padding: 12px 20px;
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .test-log {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            background: #0f172a;
            color: #cbd5e1;
            height: 300px;
        }
    </style>
</head>

<body>
    <nav class="main-nav" id="mainNav" data-page="tests"></nav>

    <main class="page-container">
        <div class="page-header">
            <h1>Agent Test Suite</h1>
            <p>Run tool-specific and pipeline tests on real-world datasets.</p>
            <p class="tests-doc-link"><a href="/pages/test-design-reference.html">Test design &amp; scenario reference</a> (union, join, duplicates, edge cases — for QA and product)</p>
        </div>

        <div class="tests-container">
            <div class="test-controls">
                <button class="btn-primary" id="runAllTests">Run All Tests</button>
            </div>

            <div class="test-grid" id="testGrid">
                <div class="empty-state">
                    <p>Loading test scenarios...</p>
                </div>
            </div>
        </div>

        <div class="test-log-container hidden" id="testLogContainer">
            <div class="test-log-header">
                <h3>Execution Log</h3>
                <button class="btn-icon" id="closeTestLog">✕</button>
            </div>
            <div class="test-log" id="testLog"></div>
        </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script src="/js/common.js"></script>
    <script src="/js/tests.js"></script>
</body>

</html>
