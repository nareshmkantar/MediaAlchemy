<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Structure Demarcation - Schema Agent</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <nav class="main-nav" id="mainNav" data-page="demarcation"></nav>

    <main class="page-container">
        <div class="page-header">
            <h1>Structure Demarcation (Step -1)</h1>
            <p>Demarcate the main data table from noise, metadata, and footnotes.</p>
        </div>

        <div class="demarcation-container">
            <div class="demarcation-toolbar">
                <div class="demarcation-stats">
                    <div class="stat-badge">
                        <span class="stat-label">Blocks Found</span>
                        <span id="blockCount" class="stat-value">-</span>
                    </div>
                </div>
                <button id="finalizeDemarcationBtn" class="btn-primary">
                    <span>✅</span> Finalize Demarcation
                </button>
            </div>

            <div class="demarcation-workspace" id="demarcationWorkspace">
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <p>Analyzing spreadsheet regions...</p>
                </div>
            </div>
        </div>
    </main>

    <div id="toastContainer" class="toast-container"></div>

    <script src="../js/common.js"></script>
    <script src="../js/demarcation.js"></script>
</body>

</html>
