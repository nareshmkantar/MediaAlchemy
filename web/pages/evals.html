<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evals - Schema Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <style>
        /* Master-Detail Layout */
        .evals-master-detail {
            display: flex;
            gap: 24px;
            margin-top: 24px;
            min-height: calc(100vh - 200px);
        }

        .evals-jobs-list {
            flex: 0 0 55%;
            max-width: 55%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            max-height: calc(100vh - 200px);
            padding-right: 12px;
        }

        .evals-detail-panel {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            position: sticky;
            top: 100px;
            height: fit-content;
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }

        .detail-empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 300px;
            color: var(--text-tertiary);
            text-align: center;
        }

        .detail-empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .detail-empty-state h3 {
            margin: 0 0 8px;
            color: var(--text-secondary);
        }

        .detail-empty-state p {
            margin: 0;
            font-size: 0.9rem;
        }

        /* Detail Panel Content */
        .detail-panel-header {
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .detail-panel-header h3 {
            margin: 0;
            color: var(--text-primary);
            font-size: 1.1rem;
        }

        .detail-step-container {
            display: flex;
            gap: 20px;
            min-height: 300px;
        }

        .detail-step-list {
            flex: 0 0 180px;
            max-height: 400px;
            overflow-y: auto;
            border-right: 1px solid var(--border);
            padding-right: 16px;
        }

        .detail-step-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            margin-bottom: 4px;
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .detail-step-item:hover {
            background: rgba(96, 165, 250, 0.1);
        }

        .detail-step-item.active {
            background: rgba(96, 165, 250, 0.2);
            border-left: 3px solid var(--accent-color);
        }

        .detail-step-item .step-idx {
            color: var(--text-tertiary);
            font-size: 0.8rem;
            min-width: 24px;
        }

        .detail-step-item .step-name {
            color: var(--text-primary);
            font-weight: 500;
            font-size: 0.85rem;
        }

        .detail-step-content {
            flex: 1;
            padding-left: 4px;
        }

        .detail-step-header h4 {
            margin: 0 0 16px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .detail-scores-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .detail-score-card {
            background: var(--bg-secondary);
            padding: 16px;
            border-radius: var(--radius-md);
            text-align: center;
        }

        .detail-score-card .score-label {
            font-size: 0.7rem;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .detail-score-card .score-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .detail-critique-section {
            background: var(--bg-secondary);
            padding: 16px;
            border-radius: var(--radius-md);
        }

        .detail-critique-section .critique-label {
            font-size: 0.7rem;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
        }

        .detail-critique-section .critique-content {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* Selected job card */
        .eval-card.selected {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.3);
        }

        .eval-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .eval-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .eval-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0;
            color: var(--text-primary);
        }

        .eval-status {
            padding: 4px 12px;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-pass {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
        }

        .status-fail {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        .status-review {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
        }

        .verdict-pass {
            color: var(--success);
        }

        .verdict-fail {
            color: var(--danger);
        }

        .eval-metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            background: rgba(15, 23, 42, 0.3);
            padding: 16px;
            border-radius: var(--radius-md);
        }

        .metric-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .metric-value {
            font-size: 1.25rem;
            font-weight: 700;
            font-family: 'Fira Code', monospace;
        }

        .value-high {
            color: var(--success);
        }

        .value-mid {
            color: var(--warning);
        }

        .value-low {
            color: var(--danger);
        }

        .eval-critique {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.6;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid var(--primary);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        }

        .eval-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            margin-top: auto;
        }

        .eval-meta {
            font-size: 0.8rem;
            color: var(--text-tertiary);
        }

        .btn-view-debug {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 6px 16px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-view-debug:hover {
            background: var(--primary);
            color: white;
        }

        /* Step Evaluations Split-Pane Styles */
        .step-evals-split {
            display: flex;
            gap: 16px;
            margin-top: 15px;
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            overflow: hidden;
            max-height: 280px;
        }

        .step-evals-list {
            width: 200px;
            min-width: 180px;
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 8px;
        }

        .step-eval-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--text-secondary);
            transition: background 0.2s;
        }

        .step-eval-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .step-eval-item.active {
            background: rgba(139, 92, 246, 0.15);
            color: var(--text-primary);
        }

        .step-eval-index {
            color: var(--text-tertiary);
            font-size: 0.7rem;
            min-width: 20px;
        }

        .step-eval-name {
            flex: 1;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .step-eval-detail {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
        }

        .step-detail-header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 12px;
        }

        .step-detail-header h4 {
            margin: 0;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .step-scores-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .step-score-item {
            background: var(--bg-primary);
            padding: 12px;
            border-radius: var(--radius-sm);
            text-align: center;
        }

        .step-score-label {
            font-size: 0.7rem;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .step-score-value {
            font-size: 1.5rem;
            font-weight: 700;
            font-family: 'Fira Code', monospace;
        }

        .step-critique-box {
            background: var(--bg-primary);
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--primary);
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <nav class="main-nav" id="mainNav" data-page="evals"></nav>

    <main class="page-container">
        <div class="page-header">
            <div class="header-content">
                <h1>LLM Judge: Quality Evals</h1>
                <p>Automated evaluation of data transformation fidelity, flatness, and integrity.</p>
            </div>
            <div class="header-actions">
                <button class="btn-primary" id="refreshEvals">Refresh Results</button>
            </div>
        </div>

        <div class="evals-master-detail">
            <!-- Left: Job Cards List -->
            <div class="evals-jobs-list" id="evalsGrid">
                <div class="empty-state">
                    <p>Loading evaluation results...</p>
                </div>
            </div>

            <!-- Right: Per-Step Evaluations Detail Panel -->
            <div class="evals-detail-panel" id="evalsDetailPanel">
                <div class="detail-empty-state">
                    <div class="empty-icon">⚖️</div>
                    <h3>Per-Step LLM Evaluations</h3>
                    <p>Select a job from the left to view detailed per-step metrics</p>
                </div>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script src="/js/common.js"></script>
    <script src="/js/evals.js"></script>
</body>

</html>
